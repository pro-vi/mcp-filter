name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        fastmcp-version: ["2.14.5", "latest"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
      - name: Install latest dependencies
        if: matrix.fastmcp-version == 'latest'
        run: uv sync --extra dev
      - name: Install minimum supported dependencies
        if: matrix.fastmcp-version != 'latest'
        run: |
          uv venv
          uv pip install -e '.[dev]' "fastmcp==${{ matrix.fastmcp-version }}"
      - name: Run unit and subprocess E2E tests
        run: .venv/bin/python -m pytest -q
