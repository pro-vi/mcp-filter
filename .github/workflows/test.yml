name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fastmcp-version: ["2.14.5", "latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
      - name: Install project
        run: uv sync --extra dev
      - name: Install minimum FastMCP
        if: matrix.fastmcp-version != 'latest'
        run: uv pip install "fastmcp==${{ matrix.fastmcp-version }}"
      - name: Run unit and subprocess E2E tests
        run: uv run pytest -q
